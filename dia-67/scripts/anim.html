<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:H;src:local('Inter Display Black'),local('Inter Black'),url(fonts/InterDisplay-Black.otf)}
@font-face{font-family:HB;src:local('Inter Display ExtraBold'),local('Inter ExtraBold'),url(fonts/InterDisplay-ExtraBold.otf)}
@font-face{font-family:M;src:local('Inter Medium'),url(fonts/Inter-Medium.otf)}
@font-face{font-family:S;src:local('Crimson Text SemiBold Italic'),url(fonts/CrimsonText-SemiBoldItalic.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0a}
#bg{position:absolute;inset:0}
#stage{position:absolute;inset:0;font-family:M;color:#f4f4f4}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:360px;transform-origin:50% 40%}
.lft{align-items:flex-start;padding-left:90px}
.l{display:block;overflow:hidden;line-height:1.02;padding:0 6px 10px}
.w{display:inline-block;will-change:transform}
.big{font-family:H;font-size:190px;letter-spacing:-6px;line-height:.92}
.mid{font-family:HB;font-size:104px;letter-spacing:-3px}
.sm{font-family:M;font-size:58px;color:#9a9a9a}
.ser{font-family:S;font-size:150px;color:#ff3b30;letter-spacing:-1px}
.red{color:#ff2a1f}
.box{background:#e10600;color:#fff;padding:0 22px;border-radius:14px}
.strike{position:relative}
.strike i{position:absolute;left:-10px;top:52%;height:16px;background:#ff2a1f;border-radius:8px}
.card{background:#151515;border:2px solid #262626;border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.cur{position:absolute;width:70px;height:70px;z-index:50}
.cur span{position:absolute;left:46px;top:52px;background:#e10600;color:#fff;font:700 26px M;padding:4px 12px;border-radius:8px;white-space:nowrap}
.caret{display:inline-block;width:10px;background:#ff2a1f;margin-left:6px;vertical-align:-8px}
.mono{font-family:'DejaVu Sans Mono',monospace}
.light{color:#111}
</style></head>
<body><div id="bg"></div><div id="stage"></div>
<script src="dur.js"></script>
<script>
const W=1080,H=1920;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>C((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bo=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

// mask reveal: words slide up from inside their line
function L(words,t,t0,cls='',st=.07){
  let i=0;
  const html=words.split('|').map(w=>{
    const k=eo(P(t,t0+i*st,t0+i*st+.38));i++;
    return `<span class="w" style="transform:translateY(${(1-k)*115}%)">${w}</span>`;
  }).join(' ');
  return `<span class="l ${cls}">${html}</span>`;
}
function typed(s,t,t0,cps=18){const n=Math.floor(C((t-t0)*cps,0,s.length));return s.slice(0,n)}
function caret(t,h=60,on=true){return on?`<span class="caret" style="height:${h}px;opacity:${Math.floor(t*2.4)%2?0:1}"></span>`:''}
function cursor(x,y,label='Tú',sc=1){
  return `<div class="cur" style="left:${x}px;top:${y}px;transform:scale(${sc})"><svg width="70" height="70" viewBox="0 0 24 24"><path d="M3 2l16 9-7 1.6-3.4 6.4z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg><span>${label}</span></div>`;
}
function strikeW(t,t0,dur=.3){return `<i style="width:calc(${eio(P(t,t0,t0+dur))*100}% + 20px)"></i>`}
function lerp(a,b,k){return a+(b-a)*k}

const scenes=[
// 0 hook: ¿Te da pena salir en cámara?
{d:3.6,f:t=>{const rec=Math.floor(t*2)%2===0;
 return `<div class="sc">
   ${L('¿Te|da|pena',t,0,'mid')}
   ${L('salir|en',t,.2,'mid')}
   <span class="l big" style="margin-top:6px"><span class="w box" style="transform:scale(${bo(P(t,.45,.85))}) rotate(${(1-eo(P(t,.45,.9)))*-8}deg)">CÁMARA?</span></span>
   <div class="card" style="width:600px;height:420px;margin-top:90px;position:relative;display:flex;align-items:center;justify-content:center;transform:translateY(${(1-eo(P(t,.6,1.1)))*300}px)">
     <div style="position:absolute;left:34px;top:30px;font:800 34px HB;color:#fff;display:flex;align-items:center;gap:14px"><span style="width:26px;height:26px;border-radius:50%;background:${rec?'#ff2a1f':'#5a1310'}"></span>REC</div>
     <div style="position:absolute;right:34px;top:30px;font:500 30px M;color:#888" class="mono">00:0${Math.min(9,Math.floor(t*2))}</div>
     <svg width="200" height="200" viewBox="0 0 24 24" style="opacity:.85"><circle cx="12" cy="8" r="4" fill="none" stroke="#777" stroke-width="1.6"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="#777" stroke-width="1.6"/></svg>
     <div style="position:absolute;left:40px;right:40px;top:50%;height:16px;border-radius:8px;background:#e10600;transform:rotate(-24deg) scaleX(${eio(P(t,1.9,2.3))});transform-origin:left"></div>
   </div>
  </div>`}},
// 1 tranquilo, no tienes que hacerlo
{d:2.6,f:t=>`<div class="sc" style="padding-top:640px">
   ${L('Tranquilo:',t,0,'sm')}
   ${L('NO',t,.15,'big')}
   ${L('<span class="ser" style="font-size:170px">tienes que</span>',t,.35,'')}
   ${L('HACERLO.',t,.55,'big')}
  </div>`},
// 2 videos que más se ven no muestran a nadie
{d:3.6,f:t=>{const v=[['2.4M',0],['870K',1],['5.1M',2]];
 return `<div class="sc">
   ${L('Muchos|de|los|videos|que',t,0,'sm')}
   ${L('más|se|ven',t,.2,'mid')}
   ${L('no|muestran|a',t,.5,'mid')}
   <span class="l big"><span class="w box" style="transform:scale(${bo(P(t,.85,1.25))})">NADIE</span></span>
   <div style="display:flex;gap:26px;margin-top:70px">${v.map(([n,i])=>{const k=bo(P(t,1.1+i*.15,1.5+i*.15));const c=parseFloat(n)*eo(P(t,1.3+i*.15,3));
    return `<div class="card" style="width:290px;height:500px;padding:18px;transform:translateY(${(1-k)*420}px) rotate(${(i-1)*4}deg);position:relative">
     <div style="height:330px;border-radius:20px;background:linear-gradient(160deg,#2a2a2a,#151515);position:relative;overflow:hidden">
      ${i==0?'<div style="position:absolute;left:24px;right:24px;top:90px;font:900 46px H;color:#fff;line-height:1">TEXTO<br><span style=\"color:#ff2a1f\">EN</span> PANTALLA</div>':''}
      ${i==1?'<div style="position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;border:10px solid #ff2a1f"></div><div style="position:absolute;left:60px;bottom:40px;width:120px;height:50px;border-radius:26px;background:#d9d9d9;transform:rotate(-20deg)"></div>':''}
      ${i==2?'<div style="position:absolute;left:70px;top:30px;width:150px;height:270px;border-radius:26px;border:6px solid #ddd"></div><div style="position:absolute;left:110px;top:150px;width:60px;height:60px;border-radius:50%;background:rgba(255,42,31,.6);transform:scale('+(0.6+0.5*Math.abs(Math.sin(t*4)))+')"></div>':''}
     </div>
     <div class="big" style="font-size:64px;margin-top:22px">${c.toFixed(1)}${n.slice(-1)}</div><div style="font:500 26px M;color:#888">vistas · sin cara</div></div>`}).join('')}</div>
  </div>`}},
// 3 tres formatos hoy mismo
{d:3.6,f:t=>`<div class="sc">
   ${L('Aquí|tienes',t,0,'sm')}
   <div style="display:flex;align-items:flex-end;gap:26px">
     <span class="l" style="font-family:H;font-size:380px;line-height:.8;letter-spacing:-12px;color:#ff2a1f"><span class="w" style="transform:translateY(${(1-eo(P(t,.1,.55)))*115}%)">3</span></span>
     <div style="padding-bottom:30px">${L('FORMATOS',t,.3,'mid')}${L('para|hoy|<span class="ser" style="font-size:96px">mismo</span>',t,.5,'sm')}</div>
   </div>
   <div style="display:flex;gap:24px;margin-top:80px">${['TEXTO','MANOS','PANTALLA'].map((s,i)=>`<div class="card" style="width:290px;padding:34px 0;text-align:center;transform:scale(${bo(P(t,.9+i*.18,1.3+i*.18))})"><div class="big" style="font-size:70px;color:#ff2a1f">${i+1}</div><div style="font:800 40px HB;margin-top:10px">${s}</div></div>`).join('')}</div>
   ${L('sin|mostrar|tu|cara',t,1.8,'sm')}
  </div>`},
// 4 formato 1 texto animado
{d:3.0,f:t=>{const words=['TEXTO','QUE','SE','MUEVE'];
 return `<div class="sc">
   <div class="box" style="font:800 40px HB;padding:8px 24px;transform:scale(${bo(P(t,0,.35))})">FORMATO 1</div>
   ${L('Texto',t,.15,'big')}
   ${L('<span class="ser" style="font-size:200px">animado,</span>',t,.35,'')}
   ${L('como|este|video.',t,.6,'mid')}
   <div style="position:relative;width:900px;height:420px;margin-top:40px">${words.map((w,i)=>{const k=P(t,1.0+i*.2,1.4+i*.2);const xs=[60,420,120,470],ys=[30,40,210,200];
     return `<div style="position:absolute;left:${xs[i]}px;top:${ys[i]+(1-eo(k))*160}px;opacity:${k};transform:rotate(${(1-eo(k))*(i%2?20:-20)}deg)" class="card"><div style="padding:22px 40px;font:900 ${i==3?84:64}px H;color:${i==3?'#ff2a1f':'#fff'}">${w}</div></div>`}).join('')}</div>
  </div>`}},
// 5 frases cortas al ritmo de la voz
{d:3.0,f:t=>{let bars='';for(let i=0;i<40;i++){const a=.2+.8*Math.abs(Math.sin(i*.7+t*8)*Math.sin(i*.29+t*3.7));bars+=`<div style="width:12px;height:${24+a*200}px;border-radius:6px;background:${i/40<P(t,.4,2.8)?'#ff2a1f':'#444'}"></div>`}
 const ph=['Frases','cortas,','al','ritmo','de','la','voz.'];const n=Math.floor(C((t-.3)/0.32,0,ph.length));
 return `<div class="sc">
   <div class="card" style="width:920px;min-height:420px;padding:60px 50px;display:flex;flex-wrap:wrap;gap:18px 26px;align-content:flex-start">${ph.map((w,i)=>`<span style="font:900 ${i==1||i==3?120:96}px H;letter-spacing:-3px;color:${i==3?'#ff2a1f':'#fff'};opacity:${i<n?1:.12};transform:translateY(${i<n?0:30}px);display:inline-block">${w}</span>`).join('')}</div>
   <div style="display:flex;align-items:center;justify-content:center;gap:7px;height:260px;margin-top:60px">${bars}</div>
   <div class="mono" style="font-size:28px;color:#888">● la voz manda el ritmo</div>
  </div>`}},
// 6 formato 2 tus manos
{d:2.6,f:t=>`<div class="sc">
   <div class="box" style="font:800 40px HB;padding:8px 24px;transform:scale(${bo(P(t,0,.35))})">FORMATO 2</div>
   ${L('Tus',t,.15,'big')}
   <span class="l"><span class="w ser" style="font-size:300px;transform:translateY(${(1-eo(P(t,.3,.75)))*115}%)">manos.</span></span>
   <div class="card" style="width:700px;height:420px;margin-top:40px;position:relative;overflow:hidden;transform:translateY(${(1-eo(P(t,.5,1)))*300}px)">
     <div style="position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px;border-radius:50%;border:14px solid #3a3a3a;background:#222"></div>
     <div style="position:absolute;left:${230+Math.sin(t*5)*30}px;top:${80+Math.cos(t*5)*20}px;width:110px;height:180px;border-radius:55px;background:#cfcfcf;transform:rotate(30deg)"></div>
     <div style="position:absolute;right:${200+Math.cos(t*5)*25}px;top:${150+Math.sin(t*5)*20}px;width:110px;height:180px;border-radius:55px;background:#bdbdbd;transform:rotate(-35deg)"></div>
     <div class="mono" style="position:absolute;left:24px;top:20px;font-size:26px;color:#ff4a40">▼ cámara desde arriba</div>
   </div>
  </div>`},
// 7 graba desde arriba: cocinas, empacas, arreglas
{d:3.4,f:t=>{const it=[['Cocinas','🍳'],['Empacas','📦'],['Arreglas','🔧']];
 return `<div class="sc">
   ${L('Graba|desde',t,0,'mid')}
   ${L('ARRIBA',t,.2,'big')}
   ${L('mientras…',t,.45,'sm')}
   <div style="display:flex;flex-direction:column;gap:30px;margin-top:70px">${it.map(([w,e],i)=>{const k=P(t,.8+i*.45,1.2+i*.45);
     return `<div class="card" style="width:760px;padding:30px 44px;display:flex;align-items:center;gap:34px;transform:translateX(${(1-eo(k))*-900}px);border-color:${k>=1?'#e10600':'#262626'}"><div style="font-size:80px">${e}</div><div style="font:900 84px H;letter-spacing:-2px">${w}</div><div style="margin-left:auto;width:58px;height:58px;border-radius:50%;background:#e10600;color:#fff;font:800 36px M;display:flex;align-items:center;justify-content:center;transform:scale(${bo(P(t,1.1+i*.45,1.35+i*.45))})">✓</div></div>`}).join('')}</div>
  </div>`}},
// 8 formato 3 tu pantalla
{d:2.6,f:t=>`<div class="sc">
   <div class="box" style="font:800 40px HB;padding:8px 24px;transform:scale(${bo(P(t,0,.35))})">FORMATO 3</div>
   ${L('Tu',t,.15,'big')}
   <span class="l"><span class="w ser" style="font-size:270px;transform:translateY(${(1-eo(P(t,.3,.75)))*115}%)">pantalla.</span></span>
   <div style="margin-top:50px;position:relative;width:420px;height:560px;border-radius:56px;border:10px solid #333;background:#121212;transform:translateY(${(1-eo(P(t,.5,1)))*400}px)">
     <div style="position:absolute;left:36px;top:30px;display:flex;align-items:center;gap:12px;font:800 28px HB;color:#fff"><span style="width:20px;height:20px;border-radius:50%;background:${Math.floor(t*2)%2?'#5a1310':'#ff2a1f'}"></span>Grabando pantalla</div>
     ${[0,1,2,3].map(i=>`<div style="position:absolute;left:36px;right:36px;top:${110+i*100}px;height:72px;border-radius:16px;background:#1f1f1f"></div>`).join('')}
   </div>
  </div>`},
// 9 grabas tu celular mientras enseñas a usar una app
{d:3.6,f:t=>{const steps=[[.6,170],[1.4,270],[2.2,370]];let taps='';for(const [s,y] of steps){const k=P(t,s,s+.5);if(k>0&&k<1)taps+=`<div style="position:absolute;left:${210-60*k}px;top:${y+36-60*k}px;width:${120*k}px;height:${120*k}px;border-radius:50%;border:6px solid rgba(255,42,31,${1-k})"></div>`}
 const cur=steps.findLast?steps.findLast(([s])=>t>=s):null;const cy=cur?cur[1]:470;
 return `<div class="sc">
   ${L('mientras|enseñas',t,0,'mid')}
   ${L('a|usar|una|<span class="red">app</span>',t,.2,'mid')}
   ${L('o|una|<span class="ser" style="font-size:120px">página.</span>',t,.4,'mid')}
   <div style="margin-top:60px;position:relative;width:420px;height:640px;border-radius:56px;border:10px solid #333;background:#121212">
     <div style="position:absolute;left:36px;top:30px;font:800 28px HB;color:#ff4a40">PASO ${Math.min(3,1+Math.floor(C((t-.6)/.8,0,2.99)))} de 3</div>
     ${[0,1,2,3].map(i=>`<div style="position:absolute;left:36px;right:36px;top:${110+i*100}px;height:72px;border-radius:16px;background:${cur&&cur[1]==170+i*100?'#3a0a08':'#1f1f1f'};border:2px solid ${cur&&cur[1]==170+i*100?'#e10600':'transparent'}"></div>`).join('')}
     ${taps}
   </div>
  </div>`}},
// 10 la voz: la tuya o IA
{d:3.6,f:t=>{const wave=(o)=>{let b='';for(let i=0;i<22;i++){const a=.2+.8*Math.abs(Math.sin(i*.8+t*(7+o))*Math.sin(i*.3+t*3));b+=`<div style="width:10px;height:${16+a*110}px;border-radius:5px;background:${o?'#ff2a1f':'#bbb'}"></div>`}return b};
 return `<div class="sc">
   ${L('Y|en|los|tres,|la',t,0,'sm')}
   ${L('VOZ',t,.2,'big')}
   ${L('puede|ser…',t,.45,'sm')}
   <div style="display:flex;flex-direction:column;gap:34px;margin-top:70px">
    ${[['la tuya',0,'🎙'],['una voz hecha con IA',1,'✦']].map(([s,o,ic],i)=>{const k=P(t,.8+i*.5,1.2+i*.5);return `<div class="card" style="width:860px;padding:34px 40px;transform:scale(${bo(k)});border-color:${o?'#e10600':'#262626'}"><div style="display:flex;align-items:center;gap:18px;font:800 52px HB;color:${o?'#ff4a40':'#fff'}"><span style="font-size:52px">${ic}</span>${s}</div><div style="display:flex;align-items:center;gap:6px;height:140px;margin-top:10px">${wave(o)}</div></div>`}).join('')}
   </div>
  </div>`}},
// 11 lo que importa no es tu cara (light)
{d:2.6,light:true,f:t=>`<div class="sc" style="padding-top:560px">
   ${L('Lo|que|importa',t,0,'mid light')}
   ${L('no|es',t,.2,'mid light')}
   <span class="l big"><span class="w strike light" style="transform:translateY(${(1-eo(P(t,.35,.75)))*115}%)">TU CARA${strikeW(t,1.1)}</span></span>
  </div>`},
// 12 es que lo que dices le sirva a alguien
{d:3.0,light:true,f:t=>`<div class="sc" style="padding-top:520px">
   ${L('Es|que|lo|que|dices',t,0,'mid light')}
   <span class="l big" style="margin-top:14px"><span class="w box" style="transform:scale(${bo(P(t,.4,.8))}) rotate(${(1-eo(P(t,.4,.85)))*-8}deg)">le sirva</span></span>
   <span class="l"><span class="w ser" style="font-size:200px;color:#e10600;transform:translateY(${(1-eo(P(t,.8,1.2)))*115}%)">a alguien.</span></span>
  </div>`},
// 13 elige un formato y publica hoy (light)
{d:3.0,light:true,f:t=>{const pick=Math.floor(C((t-.3)/.25,0,6))%3;const fixed=t>1.9;const sel=fixed?0:pick;
 return `<div class="sc">
   ${L('Elige|un|formato',t,0,'mid light')}
   <div style="display:flex;gap:24px;margin:40px 0 50px">${['TEXTO','MANOS','PANTALLA'].map((s,i)=>`<div style="width:290px;padding:30px 0;text-align:center;border-radius:30px;background:${i==sel?'#e10600':'#fff'};color:${i==sel?'#fff':'#111'};box-shadow:0 20px 50px rgba(0,0,0,.08);transform:scale(${i==sel?1.06:1})"><div style="font:800 40px HB">${s}</div></div>`).join('')}</div>
   ${L('y|publica|tu',t,1.0,'mid light')}
   ${L('primer|<span class="ser" style="font-size:120px;color:#e10600">video</span>',t,1.15,'mid light')}
   <div style="margin-top:50px;display:flex;align-items:center;gap:28px;transform:scale(${bo(P(t,1.6,2.0))})"><div style="width:120px;height:120px;border-radius:30px;border:8px solid #111;display:flex;align-items:center;justify-content:center;font:900 90px H;color:#e10600">${t>2.2?'✓':''}</div><div style="font:900 190px H;letter-spacing:-6px;color:#111">HOY</div></div>
  </div>`}},
// 15 CTA
{d:5.4,f:t=>{const liked=t>3.4;
 return `<div class="sc">
   ${L('¿Quieres|aprender?',t,0,'mid')}
   ${L('comenta',t,.35,'big')}
   <span class="l" style="font-family:H;font-size:186px;letter-spacing:-7px;line-height:.95"><span class="w red" style="transform:translateY(${(1-eo(P(t,.6,1.0)))*115}%) scale(${1+0.04*Math.sin(t*5)})">SUMIAGO</span></span>
   <div class="card" style="width:900px;margin-top:60px;padding:36px 40px;transform:translateY(${(1-eo(P(t,1.1,1.6)))*300}px)">
     <div style="font:700 32px M;color:#888;margin-bottom:26px">Comentarios</div>
     <div style="display:flex;align-items:center;gap:24px"><div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#e10600,#555)"></div>
       <div style="flex:1"><div style="font:500 28px M;color:#888">tú · ahora</div><div style="font:800 48px HB">${typed('SUMIAGO',t,1.8,8)}${t<2.8&&t>1.6?caret(t,44):''}</div></div>
       <div style="font-size:64px;color:${liked?'#ff2a1f':'#555'};transform:scale(${liked?bo(P(t,3.4,3.7))*1.0:1})">${liked?'♥':'♡'}</div></div></div>
   ${L('y|te|envío|toda',t,2.6,'sm')}${L('la|<span class="ser" style="font-size:96px">información</span>',t,2.8,'sm')}
  </div>${cursor(lerp(900,925,eio(P(t,2.8,3.4))),lerp(1700,1125,eio(P(t,2.8,3.4))),'Sumiago',t>3.4&&t<3.55?.85:1)}`}},
// 16 logo end
{d:3.4,light:true,end:true,f:t=>`<div class="sc" style="padding-top:0;justify-content:center">

   ${L('Crea|tus|videos|con|<span class="ser" style="font-size:88px;color:#e10600">IA</span>',t,.6,'light" style="font-family:HB;font-size:84px;letter-spacing:-2px')}
   <div style="margin-top:50px;background:#e10600;color:#fff;border-radius:999px;padding:26px 64px;font:800 50px HB;transform:scale(${bo(P(t,.9,1.3))})">LINK EN MI PERFIL</div>
  </div>`},
];
if(window.DUR)scenes.forEach((s,i)=>{if(DUR[i])s.d=DUR[i];if(window.K&&K[i])s.k=K[i]});
let acc=0;for(const s of scenes){s.s=acc;acc+=s.d}
window.TOTAL=acc;
const bg=document.getElementById('bg'),st=document.getElementById('stage');
window.render=function(T){
  let i=scenes.findIndex(s=>T<s.s+s.d);if(i<0)i=scenes.length-1;
  const s=scenes[i],t=T-s.s;
  // light/dark background with crossfade at scene boundary
  const L1=!!s.light;
  const glowY=1250+Math.sin(T*.6)*120, glowX=540+Math.cos(T*.4)*160;
  bg.style.background=L1?`radial-gradient(900px 900px at ${glowX}px ${glowY}px, rgba(225,6,0,.10), transparent 70%), #f1f1f1`
     :`radial-gradient(1000px 1000px at ${glowX}px ${glowY}px, rgba(225,6,0,.33), transparent 70%), #0a0a0a`;
  const exit=s.end?0:P(t,s.d-.2,s.d), ent=1-P(t,0,.12);
  const push=1+0.035*(t/s.d);
  st.innerHTML=`<div style="position:absolute;inset:0;transform:scale(${push}) translateY(${-exit*140+ent*60}px);filter:blur(${exit*22+ent*14}px);opacity:${1-exit*0.9}">${s.f(t*(s.k||1))}</div>`;
};
render(0);
